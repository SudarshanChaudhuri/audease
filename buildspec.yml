version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22  # FIXED: Updated from 18 to 22 to match your project requirements
    commands:
      # We only install the global tool here
      - npm install -g firebase-tools

  build:
    commands:
      # DEBUG: Verify we are in the right place
      - ls -la
      
      # We run everything in one chain to prevent "state loss" between phases
      - echo "Entering frontend and building..."
      - cd frontend && npm install && CI=false npm run build

  post_build:
    commands:
      - echo "Deploying to Firebase..."
      # We enter the folder again for the deploy step
      - cd frontend && firebase deploy --token "$FIREBASE_TOKEN" --non-interactive --only hosting

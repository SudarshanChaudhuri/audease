version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      # DEBUG: List all files to check folder names
      - echo "--- LISTING FILES ---"
      - ls -la
      - echo "--- END LISTING ---"
      
      # Try entering the folder (check capitalization here!)
      - cd frontend 
      - npm install
      - npm install -g firebase-tools

  build:
    commands:
      # Ensure this matches the folder name found in the 'ls -la' step above
      - cd frontend
      - echo Building...
      - CI=false npm run build

  post_build:
    commands:
      - cd frontend
      - firebase deploy --token "$FIREBASE_TOKEN" --non-interactive --only hosting

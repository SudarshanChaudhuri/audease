version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18 # Ensure this matches your local Node version
    commands:
      - echo Installing dependencies...
      - npm install
      - echo Installing Firebase CLI...
      - npm install -g firebase-tools
  
  build:
    commands:
      - echo Building the frontend...
      # Using CI=false prevents the build from crashing on minor warnings
      - CI=false npm run build 
  
  post_build:
    commands:
      - echo Deploying to Firebase...
      # This command pushes your 'dist' or 'build' folder to Firebase
      - firebase deploy --token "$FIREBASE_TOKEN" --non-interactive --only hosting

# You usually don't need artifacts for Firebase because the 'firebase deploy' command
# sends the files directly to Google's servers.

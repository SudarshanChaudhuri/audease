version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      # 1. Enter the folder where package.json lives
      - cd frontend
      - echo Installing dependencies...
      - npm install
      - npm install -g firebase-tools

  build:
    commands:
      # 2. You must enter the folder AGAIN (CodeBuild resets to root here)
      - cd frontend
      - echo Building the frontend...
      - CI=false npm run build

  post_build:
    commands:
      # 3. Enter the folder one last time
      - cd frontend
      - echo Deploying to Firebase...
      - firebase deploy --token "$FIREBASE_TOKEN" --non-interactive --only hosting

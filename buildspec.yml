version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22  # Keeps Node 22 to fix the version errors
    commands:
      # Install Firebase CLI globally
      - npm install -g firebase-tools

  build:
    commands:
      - echo "Starting the complete Build & Deploy process..."
      
      # We chain all commands together with '&&'. 
      # This ensures we stay inside the 'frontend' folder the entire time.
      - cd frontend && npm install && CI=false npm run build && firebase deploy --token "$FIREBASE_TOKEN" --non-interactive --only hosting

# We removed the post_build phase to prevent directory errors.
